<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Learn - CG & Broadcast Academy</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            base: '#0a0d12',
                            card: '#121721',
                            border: '#1f293d',
                            hover: '#1a2232',
                            accent: '#00f0ff',
                            red: '#ff2a55',
                            emerald: '#10b981',
                            purple: '#8b5cf6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0d12;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0d12; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
        .glass-panel {
            background: rgba(18, 23, 33, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(22, 27, 38, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(31, 41, 61, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.15);
        }
        .live-indicator { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-studio-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid font-tech text-xl">CG</i>
                </div>
                <div>
                    <h1 class="font-tech text-lg font-bold tracking-wider text-white flex items-center gap-2">
                        BROADCAST <span class="text-cyan-400 font-normal">ACADEMY</span>
                    </h1>
                    <p class="text-xs text-gray-400 font-mono tracking-tight hidden sm:block">MEDIA LEARN & REALTIME DATABASE</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="adminLogin()" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-lock text-xs"></i> Admin Panel
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-studio-card via-studio-base to-indigo-950/40 border border-studio-border p-6 sm:p-10 mb-8">
            <div class="absolute -right-12 -bottom-12 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 max-w-2xl">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider mb-4">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 live-indicator"></span> Realtime Firebase Cloud Enabled
                </div>
                <h2 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight mb-4">
                    Media Learn <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">Video Tutorials</span>
                </h2>
                <p class="text-gray-300 text-sm sm:text-base leading-relaxed mb-6">
                    All video links, categories, and titles are automatically synchronized live via Google Firebase Realtime Database.
                </p>
            </div>
        </div>

        <div id="videoContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic videos loaded from Firebase -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-studio-border bg-studio-base py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-500">
            CG & Broadcast Academy Operations Hub &copy; 2026
        </div>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMrYYckFrrQvz1f0ij_KzEuofHpkYTT6g",
            authDomain: "media-learn.firebaseapp.com",
            databaseURL: "https://media-learn-default-rtdb.firebaseio.com",
            projectId: "media-learn",
            storageBucket: "media-learn.firebasestorage.app",
            messagingSenderId: "173152194707",
            appId: "1:173152194707:web:ef4c3dc4c64fec33413d66",
            measurementId: "G-80WL54NSX6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.adminLogin = function() {
            let pass = prompt("Enter Admin Password:");
            if(pass === "admin123") {
                let title = prompt("Enter Video Title:");
                let url = prompt("Enter Video URL:");
                let category = prompt("Enter Category (e.g., CG, Audio, Switcher):");
                if(title && url) {
                    const videoListRef = ref(db, 'videos');
                    const newVideoRef = push(videoListRef);
                    set(newVideoRef, {
                        title: title,
                        url: url,
                        category: category || "General",
                        timestamp: Date.now()
                    }).then(() => alert("Saved to Firebase successfully!"))
                    .catch(err => alert("Error saving: " + err.message));
                }
            } else if(pass !== null) {
                alert("Incorrect Password!");
            }
        };

        const videosRef = ref(db, 'videos');
        onValue(videosRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('videoContainer');
            if(!container) return;
            
            container.innerHTML = "";
            
            if(data) {
                Object.keys(data).forEach(key => {
                    const v = data[key];
                    container.innerHTML += `
                        <div class="glass-card rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                            <div>
                                <span class="text-[11px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full font-mono uppercase">${v.category}</span>
                                <h3 class="font-bold text-lg text-white mt-4 mb-2">${v.title}</h3>
                            </div>
                            <a href="${v.url}" target="_blank" class="mt-4 px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-bold rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-play"></i> Watch Stream
                            </a>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = `<p class="text-gray-500 col-span-3 text-center py-10">No videos found in cloud yet. Click Admin Panel to publish one!</p>`;
            }
        });
    </script>
</body>
</html>
